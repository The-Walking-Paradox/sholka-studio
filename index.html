<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>श्लोक स्क्रोल स्टुडियो — विधि चक्र</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0a0603;font-family:'Noto Sans Devanagari',serif;overflow-x:hidden;}
body{min-height:100vh;}
input,textarea,button,select{font-family:'Noto Sans Devanagari',serif;outline:none;}
input[type=range]{width:100%;cursor:pointer;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}
#setup{display:flex;flex-direction:column;align-items:center;padding:30px 16px 130px;}
.card{width:100%;max-width:460px;border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:20px;}
.lbl{display:block;font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-weight:600;}
.inp{width:100%;border-radius:10px;padding:11px 13px;font-size:16px;border-width:1px;border-style:solid;}
textarea.inp{resize:vertical;line-height:1.9;font-size:17px;}
.chip{border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid;transition:all .2s;background:transparent;}
.dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border-width:2.5px;border-style:solid;transition:all .2s;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;border-width:1px;border-style:solid;transition:all .2s;margin-bottom:8px;}
.rdot{width:18px;height:18px;border-radius:50%;flex-shrink:0;border-width:2px;border-style:solid;}
.sz{flex:1;padding:10px 0;border-radius:12px;font-weight:700;cursor:pointer;border-width:1px;border-style:solid;background:transparent;}
.thumb{position:relative;width:66px;height:66px;border-radius:10px;overflow:hidden;border-width:1px;border-style:solid;flex-shrink:0;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.del{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s;font-size:20px;color:#FF6B6B;}
.thumb:hover .del{opacity:1;}
.add{width:66px;height:66px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;border-width:1px;border-style:dashed;flex-shrink:0;}
.tgl{width:46px;height:26px;border-radius:13px;cursor:pointer;position:relative;transition:all .3s;border-width:1px;border-style:solid;flex-shrink:0;}
.tgk{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;transition:all .3s;}
.go{border:none;border-radius:40px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:1px;width:100%;}
#sticky{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#0a0603 60%,rgba(10,6,3,.85) 85%,transparent);display:none;justify-content:center;}
#sticky button{width:100%;max-width:460px;border:none;border-radius:40px;padding:16px;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:1px;font-family:'Noto Sans Devanagari',serif;}
.uz{border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;border-width:1px;border-style:dashed;}
.orow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
.lineRow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid;margin-bottom:6px;}
.numin{width:62px;border-radius:8px;padding:7px 6px;font-size:14px;text-align:center;border-width:1px;border-style:solid;}
#player{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;}
#cv{max-width:100%;max-height:100vh;display:block;touch-action:none;}
#pc{position:absolute;bottom:0;left:0;right:0;z-index:31;display:none;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;padding:16px 10px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.75),transparent);}
.pcb{border-radius:30px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid rgba(255,200,90,.45);color:#FFC85A;background:rgba(0,0,0,.5);font-family:'Noto Sans Devanagari',serif;}
.pcr{border-radius:50%;width:46px;height:46px;font-size:18px;padding:0;}
#exp,#gm,#tapm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.93);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:22px;}
</style>
</head>
<body>

<div id="setup"></div>
<div id="sticky"><button id="stickyGo" onclick="startPlayer()">▶ PREVIEW</button></div>

<div id="player">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="pc">
    <div id="pcPlay" class="pcb pcr" onclick="togglePlay(event)">⏸</div>
    <button class="pcb pcr" onclick="resetPlayer(event)">↺</button>
    <button class="pcb" onclick="openExport(event)">⬇ Save MP4</button>
    <button class="pcb pcr" onclick="showGuide(event)">?</button>
    <button class="pcb pcr" onclick="exitPlayer(event)">⚙</button>
  </div>
</div>

<div id="exp"></div>
<div id="gm" onclick="hideGuide()"></div>
<div id="tapm"></div>
<audio id="aud" loop style="display:none;"></audio>

  if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;}
  let sc=1,oy=0,ox=0;
  if(sPhotoFx==='kenburns'){sc=1+.16*prog;oy=-prog*H*.05;}
  else if(sPhotoFx==='zoomin')sc=1+.18*prog;
  else if(sPhotoFx==='zoomout')sc=1.18-.18*prog;
  else if(sPhotoFx==='panup'){sc=1.14;oy=-(prog-.5)*H*.10;}
  else sc=1.02;
  dw*=sc;dh*=sc;
  ctx.drawImage(img,(W-dw)/2+ox,(H-dh)/2+oy,dw,dh);
}

// ── SCROLL GRAPHICS ──
function drawScrollBase(cx,cy,w,h){
  if(sScroll==='none')return;
  ctx.save();
  if(sScroll==='parchment'){
    const rodW=34,bodyW=w-rodW*2;
    // shadow
    ctx.fillStyle='rgba(0,0,0,.45)';
    rr(cx-w/2+8,cy-h/2+10,w,h,10);ctx.fill();
    // paper
    const pg=ctx.createLinearGradient(0,cy-h/2,0,cy+h/2);
    pg.addColorStop(0,'#efe3c6');pg.addColorStop(.5,'#e6d8b6');pg.addColorStop(1,'#d8c69e');
    ctx.fillStyle=pg;
    ctx.beginPath();
    // slightly wavy top/bottom edges
    const L=cx-bodyW/2,R=cx+bodyW/2,T=cy-h/2,B=cy+h/2;
    ctx.moveTo(L,T);
    for(let x=L;x<=R;x+=40)ctx.lineTo(x,T+Math.sin(x*.05)*3);
    ctx.lineTo(R,B);
    for(let x=R;x>=L;x-=40)ctx.lineTo(x,B+Math.sin(x*.05)*3);
    ctx.closePath();ctx.fill();
    // inner border line
    ctx.strokeStyle='rgba(120,90,45,.30)';ctx.lineWidth=2;
    ctx.strokeRect(L+16,T+14,bodyW-32,h-28);
    // wooden rods
    [cx-w/2+rodW/2,cx+w/2-rodW/2].forEach(rx=>{
      const wg=ctx.createLinearGradient(rx-rodW/2,0,rx+rodW/2,0);
      wg.addColorStop(0,'#3a2412');wg.addColorStop(.35,'#6b4423');wg.addColorStop(.6,'#8a5a2f');wg.addColorStop(1,'#3a2412');
      ctx.fillStyle=wg;
      rr(rx-rodW/2,cy-h/2-16,rodW,h+32,rodW/2);ctx.fill();
      // end caps
      ctx.fillStyle='#2c1a0d';
      rr(rx-rodW/2-5,cy-h/2-26,rodW+10,16,7);ctx.fill();
      rr(rx-rodW/2-5,cy+h/2+10,rodW+10,16,7);ctx.fill();
    });
  } else if(sScroll==='stone'){
    ctx.fillStyle='rgba(0,0,0,.5)';rr(cx-w/2+7,cy-h/2+9,w,h,14);ctx.fill();
    const sg=ctx.createLinearGradient(0,cy-h/2,0,cy+h/2);
    sg.addColorStop(0,'#8d8a85');sg.addColorStop(.5,'#6e6c68');sg.addColorStop(1,'#524f4b');
    ctx.fillStyle=sg;rr(cx-w/2,cy-h/2,w,h,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=3;rr(cx-w/2+12,cy-h/2+12,w-24,h-24,8);ctx.stroke();
  } else if(sScroll==='banner'){
    ctx.fillStyle='rgba(0,0,0,.42)';rr(cx-w/2+7,cy-h/2+9,w,h,8);ctx.fill();
    const bg=ctx.createLinearGradient(0,cy-h/2,0,cy+h/2);
    bg.addColorStop(0,'#a3221f');bg.addColorStop(.5,'#c62d24');bg.addColorStop(1,'#8e1b19');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(cx-w/2,cy-h/2);ctx.lineTo(cx+w/2,cy-h/2);ctx.lineTo(cx+w/2,cy+h/2);
    ctx.lineTo(cx,cy+h/2-22);ctx.lineTo(cx-w/2,cy+h/2);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,215,120,.55)';ctx.lineWidth=3;
    ctx.strokeRect(cx-w/2+14,cy-h/2+12,w-28,h-46);
  }
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ── SINGLE LINE (reference format) ──
// shrink a font until the text fits inside maxW
function fitFont(text,weight,startSize,maxW){
  let s=startSize;
  ctx.font=`${weight} ${s}px 'Noto Sans Devanagari',serif`;
  let w=ctx.measureText(text).width,guard=0;
  while(w>maxW&&s>14&&guard<80){
    s*=Math.max(0.72,maxW/w);
    ctx.font=`${weight} ${s}px 'Noto Sans Devanagari',serif`;
    w=ctx.measureText(text).width;guard++;
  }
  return s;
}
// geometry of the paper: how much room the text actually has
function scrollMetrics(){
  const MAXBOX=W*0.92;
  const rod=(sScroll==='parchment')?34:0;
  const pad=(sScroll==='none')?20:48;      // breathing room inside the paper
  return{MAXBOX,rod,pad,maxTextW:MAXBOX-rod*2-pad*2};
}

function drawSingle(cy,li,prog,P,S,ink,t){
  const f=FZ();
  const line=sLines[li]||'';
  const{MAXBOX,rod,pad,maxTextW}=scrollMetrics();

  // 1. size the font so the COMPLETE line fits the paper
  ctx.save();
  const fsz=fitFont(line,700,f.sz,maxTextW);
  ctx.font=`700 ${fsz}px 'Noto Sans Devanagari',serif`;
  const fullW=ctx.measureText(line).width;
  ctx.restore();

  // 2. box is sized for the complete line, so it never jumps while typing
  const boxW=Math.min(MAXBOX,Math.max(W*0.60,fullW+pad*2+rod*2));
  const boxH=fsz*2.2;
  drawScrollBase(W/2,cy,boxW,boxH);

  // 3. reserve the full line's footprint, then write into it left-to-right
  const blockLeft=W/2-fullW/2;

  let shown=line,alpha=1,dy=0,leftAlign=false;
  if(sReveal==='type'){
    const g=graphemes(line);
    const rev=clamp(prog/0.62,0,1);
    shown=g.slice(0,Math.max(1,Math.round(rev*g.length))).join('');
    leftAlign=true;
  } else if(sReveal==='word'){
    const w=line.split(/\s+/);
    const rev=clamp(prog/0.62,0,1);
    shown=w.slice(0,Math.max(1,Math.round(rev*w.length))).join(' ');
    leftAlign=true;
  } else if(sReveal==='fade'){
    alpha=clamp(prog/0.18,0,1)*(prog>0.92?clamp((1-prog)/0.08,0,1):1);
  } else if(sReveal==='slide'){
    const k=clamp(prog/0.22,0,1);
    dy=(1-easeOut(k))*46;alpha=k;
  }

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.textBaseline='middle';
  ctx.font=`700 ${fsz}px 'Noto Sans Devanagari',serif`;
  if(sScroll==='none'){
    ctx.fillStyle=P;ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=22;
  } else if(sScroll==='banner'){
    ctx.fillStyle='#FFE9B0';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;
  } else {
    ctx.fillStyle=ink;ctx.shadowColor='rgba(255,255,255,.25)';ctx.shadowBlur=2;
  }
  if(leftAlign){
    ctx.textAlign='left';
    ctx.fillText(shown,blockLeft,cy+dy);
  } else {
    ctx.textAlign='center';
    ctx.fillText(shown,W/2,cy+dy);
  }
  // blinking quill caret while writing
  if(leftAlign&&prog<0.62&&Math.floor(t*2.5)%2===0){
    const w=ctx.measureText(shown).width;
    ctx.globalAlpha=alpha*.5;
    ctx.fillRect(blockLeft+w+7,cy+dy-fsz*.42,4,fsz*.82);
  }
  ctx.restore();
}

// ── FULL VERSE + HIGHLIGHT ──
function drawVerse(cy,li,prog,P,S,ink,t){
  const f=FZ();
  const n=sLines.length;
  const{MAXBOX,rod,pad,maxTextW}=scrollMetrics();
  // start from a size that fits the block vertically, then shrink for the widest line
  let fsz=Math.max(26,Math.min(f.sz*0.72,(H*0.34)/(n*1.5)));
  ctx.save();
  let widest=sLines.reduce((a,b)=>{
    ctx.font=`700 ${fsz}px 'Noto Sans Devanagari',serif`;
    return ctx.measureText(b).width>ctx.measureText(a).width?b:a;
  },sLines[0]||'');
  fsz=fitFont(widest,700,fsz,maxTextW);          // guarantee it fits the paper
  ctx.font=`700 ${fsz}px 'Noto Sans Devanagari',serif`;
  const maxW=ctx.measureText(widest).width;
  ctx.restore();

  const lh=fsz*1.62;
  const blockH=lh*n;
  const boxH=blockH+fsz*1.4;
  const boxW=Math.min(MAXBOX,Math.max(W*0.62,maxW+pad*2+rod*2));
  const top=cy-blockH/2+lh/2;
  drawScrollBase(W/2,cy,boxW,boxH);
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  sLines.forEach((l,i)=>{
    const active=i===li;
    const pop=active?1+0.05*Math.sin(prog*Math.PI):1;
    ctx.font=`${active?900:600} ${fsz*pop}px 'Noto Sans Devanagari',serif`;
    if(sScroll==='none'){
      ctx.fillStyle=active?P:gC(P,.38);
      ctx.shadowColor=active?P:'rgba(0,0,0,.8)';ctx.shadowBlur=active?26:8;
    } else if(sScroll==='banner'){
      ctx.fillStyle=active?'#FFF2CC':'rgba(255,230,180,.42)';
      ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=active?12:4;
    } else {
      ctx.fillStyle=active?ink:'rgba(90,70,40,.42)';
      ctx.shadowColor='rgba(255,255,255,.2)';ctx.shadowBlur=2;
    }
    ctx.fillText(l,W/2,top+i*lh);
    // underline sweep on the active line
    if(active&&sScroll!=='none'){
      const w=ctx.measureText(l).width;
      ctx.save();
      ctx.globalAlpha=.55;
      ctx.fillStyle=sScroll==='banner'?'#FFD98A':S;
      ctx.fillRect(W/2-w/2,top+i*lh+fsz*.72,w*clamp(prog,0,1),4);
      ctx.restore();
    }
  });
  ctx.restore();
}

function drawWatermark(P){
  const pad=42;
  let x,y,an;
  if(sWmPos==='tl'){x=pad;y=pad+26;an='left';}
  else if(sWmPos==='tr'){x=W-pad;y=pad+26;an='right';}
  else if(sWmPos==='bl'){x=pad;y=H-70;an='left';}
  else{x=W-pad;y=H-70;an='right';}
  ctx.save();
  if(logoObj){
    const lh=68,lw=lh*(logoObj.width/logoObj.height);
    ctx.globalAlpha=.95;
    ctx.drawImage(logoObj,an==='right'?x-lw:x,y-lh/2,lw,lh);
  } else {
    ctx.textAlign=an;ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=10;
    ctx.font=`700 32px 'Noto Sans Devanagari',serif`;
    ctx.fillStyle=P;ctx.fillText('🔯 विधि चक्र',x,y);
    ctx.font=`400 18px monospace`;ctx.fillStyle=gC(P,.6);
    ctx.fillText('VIDHI CHAKRA',x,y+34);
  }
  ctx.restore();
}

function drawProgress(t,P){
  const T=totalDur();if(T<=0)return;
  const p=sLoop?((t%T)/T):clamp(t/T,0,1);
  ctx.save();
  ctx.fillStyle=gC(P,.18);ctx.fillRect(0,H-8,W,8);
  ctx.fillStyle=P;ctx.fillRect(0,H-8,W*p,8);
  ctx.restore();
}

async function renderMp4(){
  if(typeof Mp4Muxer==='undefined'||!('VideoEncoder' in window)){
    alert("MP4 export needs iPhone Safari (iOS 16.4+) or desktop Chrome.\n\nOtherwise use your phone's screen recorder.");return;
  }
  const dur=parseInt(el('ed').value),FPS=30,frames=dur*FPS;
  el('ebtns').style.display='none';el('es').style.display='block';
  try{
    const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
    const enc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>console.log(e)});
    enc.configure({codec:'avc1.640028',width:W,height:H,bitrate:8000000,framerate:FPS});
    for(let i=0;i<frames;i++){
      drawFrame(i/FPS);
      const fr=new VideoFrame(el('cv'),{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      enc.encode(fr,{keyFrame:i%30===0});fr.close();
      if(i%3===0){
        const p=Math.round(i/frames*100);
        el('ep').textContent='Rendering... '+p+'%';el('eb').style.width=p+'%';
        await new Promise(r=>setTimeout(r,0));
      }
    }
    el('ep').textContent='Finalizing...';
    await enc.flush();mux.finalize();
    window._blob=new Blob([mux.target.buffer],{type:'video/mp4'});
    el('es').style.display='none';el('edone').style.display='block';
  }catch(err){
    console.log(err);alert('Render failed: '+err.message);
    el('es').style.display='none';el('ebtns').style.display='flex';
  }
}
async function saveMp4(){
  if(!window._blob)return;
  const f=new File([window._blob],'vidhichakra-shlok.mp4',{type:'video/mp4'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:'Vidhi Chakra'});}
    catch(e){if(e.name!=='AbortError')dl();}
  } else dl();
}
function dl(){
  const u=URL.createObjectURL(window._blob);
  const a=document.createElement('a');a.href=u;a.download='vidhichakra-shlok.mp4';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

  ${ps.length?`<div>
    <label class="lbl" style="color:${L}">💾 SAVED</label>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto">
      ${ps.map((p,i)=>`<div style="padding:9px 11px;border-radius:10px;border:1px solid ${gC(P,.2)};background:${gC(P,.04)};display:flex;align-items:center;gap:8px">
        <div style="flex:1;overflow:hidden"><div style="color:${P};font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div style="color:${M};font-size:10px">${(p.sLines||[]).length} lines</div></div>
        <button onclick="loadPreset(${i})" style="background:${gC(P,.18)};color:${P};border:1px solid ${gC(P,.4)};border-radius:18px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:inherit">Load</button>
        <button onclick="delPreset(${i})" style="background:transparent;color:rgba(255,110,110,.7);border:1px solid rgba(255,110,110,.3);border-radius:50%;width:25px;height:25px;cursor:pointer;font-size:11px">✕</button>
      </div>`).join('')}
    </div></div>`:''}

  <!-- LYRICS -->
  <div>
    <label class="lbl" style="color:${L}">श्लोक / lyrics — one line per row <span style="color:#FF6B6B">*</span></label>
    <textarea class="inp" id="lyr" rows="5" placeholder="ॐ गं गणपतये नमो नमः&#10;श्री सिद्धिविनायक नमो नमः&#10;अष्टविनायक नमो नमः&#10;गणपती बाप्पा मोरया" oninput="setLinesFromText(this.value);updateTotalLbl();syncGo()" style="background:${F};border:1px solid ${B};color:${P}">${sLines.join('\n')}</textarea>
    <div style="margin-top:9px">
      <div style="color:${M};font-size:10px;letter-spacing:3px;margin-bottom:7px">QUICK START</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${SAMPLES.map((s,i)=>`<button class="chip" onclick="useSample(${i})" style="color:${gC(P,.5)};border:1px solid ${gC(P,.18)}">${s.label}</button>`).join('')}
      </div>
    </div>
  </div>

  <!-- TIMING -->
  ${sLines.length?`<div style="border-top:1px solid ${gC(P,.1)};padding-top:16px">
    <label class="lbl" style="color:${L}">⏱ TIMING — total <span id="totalLbl" style="color:${P}">${totalDur().toFixed(1)}s</span></label>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button onclick="openTapTimer()" style="flex:2;padding:11px;border-radius:10px;background:${gC(P,.14)};color:${P};border:1px solid ${gC(P,.45)};font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">👆 Tap To Time</button>
      <button onclick="autoSuggestAll()" style="flex:1;padding:11px;border-radius:10px;background:transparent;color:${gC(P,.55)};border:1px solid ${gC(P,.2)};font-size:12px;cursor:pointer;font-family:inherit">Auto</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px;align-items:center">
      <span style="color:${M};font-size:11px">Even split:</span>
      ${[10,15,20,30].map(t=>`<button onclick="evenSplit(${t})" style="flex:1;padding:7px 0;border-radius:8px;background:transparent;color:${gC(P,.5)};border:1px solid ${gC(P,.16)};font-size:11px;cursor:pointer;font-family:inherit">${t}s</button>`).join('')}
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto">
      ${sLines.map((l,i)=>`<div class="lineRow" style="border-color:${gC(P,.15)};background:${gC(P,.03)}">
        <div style="width:20px;color:${M};font-size:11px;flex-shrink:0">${i+1}</div>
        <div style="flex:1;color:${gC(P,.85)};font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${l}</div>
        <button onclick="nudgeDur(${i},-0.2)" style="width:26px;height:26px;border-radius:6px;background:${gC(P,.08)};color:${P};border:1px solid ${gC(P,.2)};cursor:pointer;font-size:13px;flex-shrink:0">−</button>
        <input class="numin" type="number" step="0.1" min="0.3" value="${sDur[i]}" onchange="setDur(${i},this.value)" style="background:${F};border:1px solid ${B};color:${P};flex-shrink:0"/>
        <button onclick="nudgeDur(${i},0.2)" style="width:26px;height:26px;border-radius:6px;background:${gC(P,.08)};color:${P};border:1px solid ${gC(P,.2)};cursor:pointer;font-size:13px;flex-shrink:0">+</button>
      </div>`).join('')}
    </div>
  </div>`:''}

  <!-- LAYOUT -->
  <div>
    <label class="lbl" style="color:${L}">LAYOUT</label>
    ${LAYOUT.map(m=>`<div class="row" style="background:${sLayout===m.id?gC(P,.12):'transparent'};border-color:${sLayout===m.id?gC(P,.5):gC(P,.12)}" onclick="sLayout='${m.id}';renderSetup()">
      <div class="rdot" style="border-color:${sLayout===m.id?P:gC(P,.3)};background:${sLayout===m.id?P:'transparent'}"></div>
      <div style="flex:1"><div style="color:${sLayout===m.id?P:gC(P,.55)};font-size:13px;font-weight:700">${m.label}</div><div style="color:${M};font-size:11px;margin-top:2px">${m.desc}</div></div>
    </div>`).join('')}
  </div>

  <!-- REVEAL -->
  ${sLayout==='single'?`<div>
    <label class="lbl" style="color:${L}">TEXT REVEAL</label>
    ${REVEAL.map(m=>`<div class="row" style="background:${sReveal===m.id?gC(P,.12):'transparent'};border-color:${sReveal===m.id?gC(P,.5):gC(P,.12)}" onclick="sReveal='${m.id}';renderSetup()">
      <div class="rdot" style="border-color:${sReveal===m.id?P:gC(P,.3)};background:${sReveal===m.id?P:'transparent'}"></div>
      <div style="flex:1"><div style="color:${sReveal===m.id?P:gC(P,.55)};font-size:13px;font-weight:700">${m.label}</div><div style="color:${M};font-size:11px;margin-top:2px">${m.desc}</div></div>
    </div>`).join('')}
  </div>`:''}

  <!-- SCROLL STYLE -->
  <div>
    <label class="lbl" style="color:${L}">SCROLL STYLE</label>
    ${SCROLL_STYLES.map(m=>`<div class="row" style="background:${sScroll===m.id?gC(P,.12):'transparent'};border-color:${sScroll===m.id?gC(P,.5):gC(P,.12)}" onclick="sScroll='${m.id}';renderSetup()">
      <div class="rdot" style="border-color:${sScroll===m.id?P:gC(P,.3)};background:${sScroll===m.id?P:'transparent'}"></div>
      <div style="flex:1"><div style="color:${sScroll===m.id?P:gC(P,.55)};font-size:13px;font-weight:700">${m.label}</div><div style="color:${M};font-size:11px;margin-top:2px">${m.desc}</div></div>
    </div>`).join('')}
    <div style="margin-top:10px">
      <div style="color:${L};font-size:10px;letter-spacing:2px;margin-bottom:6px">SCROLL POSITION — <span id="syl" style="color:${P}">${Math.round(sScrollY*100)}%</span></div>
      <input type="range" min="40" max="88" step="1" value="${Math.round(sScrollY*100)}" oninput="sScrollY=+this.value/100;el('syl').textContent=this.value+'%'" style="accent-color:${P}"/>
    </div>
  </div>

  <!-- THEME + FONT -->
  <div>
    <label class="lbl" style="color:${L}">COLOUR</label>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:${sTheme==='custom'?12:0}px">
      ${THEMES.map(t=>`<div style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer" onclick="sTheme='${t.id}';renderSetup()">
        <div class="dot" style="background:${t.id==='custom'?'conic-gradient(red,orange,yellow,green,cyan,blue,violet,red)':`linear-gradient(135deg,${t.p},${t.s})`};border-color:${sTheme===t.id?'#fff':'transparent'}"></div>
        <span style="color:${sTheme===t.id?'#fff':gC(P,.4)};font-size:9px">${t.label.toUpperCase()}</span></div>`).join('')}
    </div>
    ${sTheme==='custom'?`<input type="color" value="${sCustomClr}" oninput="sCustomClr=this.value;renderSetup()" style="width:56px;height:38px;border:none;border-radius:8px;background:transparent;cursor:pointer"/>`:''}
  </div>
  <div>
    <label class="lbl" style="color:${L}">TEXT SIZE</label>
    <div style="display:flex;gap:8px">${FONTS.map(f=>`<button class="sz" onclick="sFont='${f.id}';renderSetup()" style="color:${sFont===f.id?P:gC(P,.4)};border-color:${sFont===f.id?gC(P,.55):gC(P,.15)};background:${sFont===f.id?gC(P,.2):'transparent'};font-size:${f.id==='sm'?13:f.id==='md'?16:f.id==='lg'?19:23}px">${f.label}</button>`).join('')}</div>
  </div>

  <!-- TITLE -->
  <div><label class="lbl" style="color:${L}">TOP TITLE (optional)</label>
    <input class="inp" value="${sTitle}" placeholder="॥ श्री गणेशाय नमः ॥" oninput="sTitle=this.value" style="background:${F};border:1px solid ${B};color:${P}"/></div>

  <!-- IMAGES -->
  <div>
    <label class="lbl" style="color:${L}">देवता फोटो</label>
    <div class="uz" style="border-color:${gC(P,.28)};background:${gC(P,.02)};margin-bottom:${sImages.length?12:0}px" onclick="el('fi').click()">
      <div style="font-size:24px;margin-bottom:5px">🖼️</div>
      <div style="color:${gC(P,.5)};font-size:13px">Upload deity photos</div>
    </div>
    <input type="file" id="fi" accept="image/*" multiple style="display:none" onchange="addImages(this)"/>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${sImages.map((s,i)=>`<div class="thumb" style="border-color:${gC(P,.3)}"><img src="${s}"/><div class="del" onclick="removeImg(${i})">✕</div></div>`).join('')}
      ${sImages.length?`<div class="add" style="border-color:${gC(P,.25)};color:${gC(P,.4)}" onclick="el('fi').click()">+</div>`:''}
    </div>
    ${sImages.length?`<div style="margin-top:10px">
      <div style="color:${L};font-size:10px;letter-spacing:2px;margin-bottom:7px">PHOTO MOTION</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${PHOTO_FX.map(p=>`<button class="chip" onclick="sPhotoFx='${p.id}';renderSetup()" style="color:${sPhotoFx===p.id?P:gC(P,.45)};border-color:${sPhotoFx===p.id?gC(P,.55):gC(P,.15)};background:${sPhotoFx===p.id?gC(P,.16):'transparent'}">${p.label}</button>`).join('')}</div>
    </div>`:''}
    ${sImages.length>1?`<div style="margin-top:10px">
      <div style="color:${L};font-size:10px;letter-spacing:2px;margin-bottom:6px">PHOTO CHANGE — <span id="iil" style="color:${P}">${sImgInt}s</span></div>
      <input type="range" min="3" max="30" value="${sImgInt}" oninput="sImgInt=+this.value;el('iil').textContent=this.value+'s'" style="accent-color:${P}"/>
    </div>`:''}
  </div>

  <!-- AUDIO (optional) -->
  <div style="border-top:1px solid ${gC(P,.1)};padding-top:16px">
    <label class="lbl" style="color:${L}">🎵 AUDIO (optional — for previewing only)</label>
    ${sAudioSrc
      ?`<div style="display:flex;align-items:center;gap:10px;padding:11px;background:${gC(P,.06)};border:1px solid ${gC(P,.22)};border-radius:12px">
          <div style="font-size:19px">🎵</div>
          <div style="flex:1;overflow:hidden"><div style="color:${P};font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sAudioName}</div><div style="color:${M};font-size:10px">${sAudioDur?sAudioDur.toFixed(1)+'s':''}</div></div>
          <button onclick="clearAudio()" style="background:rgba(255,110,110,.15);color:#FF6B6B;border:1px solid rgba(255,110,110,.4);border-radius:18px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit">Remove</button>
        </div>`
      :`<div class="uz" style="border-color:${gC(P,.22)};background:${gC(P,.02)}" onclick="el('fa').click()">
          <div style="color:${gC(P,.45)};font-size:12px">Have the audio file? Upload to preview with sound</div>
          <div style="color:${M};font-size:11px;margin-top:4px">Using platform audio instead? Use 👆 Tap To Time</div>
        </div>`}
    <input type="file" id="fa" accept="audio/*" style="display:none" onchange="handleAudio(this)"/>
  </div>

  <!-- WATERMARK -->
  <div style="border-top:1px solid ${gC(P,.1)};padding-top:16px">
    <div style="color:${P};font-size:13px;font-weight:700;margin-bottom:12px">🔯 विधि चक्र Watermark</div>
    <div class="uz" style="border-color:${gC(P,.25)};background:${gC(P,.02)};padding:${sLogo?8:14}px" onclick="el('fl').click()">
      ${sLogo?`<img src="${sLogo}" style="height:48px;object-fit:contain"/>`:`<div style="color:${gC(P,.45)};font-size:12px">Upload logo (or use text badge)</div>`}
    </div>
    <input type="file" id="fl" accept="image/*" style="display:none" onchange="setLogo(this)"/>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${WMPOS.map(p=>`<button onclick="sWmPos='${p.id}';renderSetup()" style="flex:1;padding:8px 0;border-radius:10px;background:${sWmPos===p.id?gC(P,.18):'transparent'};color:${sWmPos===p.id?P:gC(P,.4)};border:1px solid ${sWmPos===p.id?gC(P,.55):gC(P,.15)};font-size:16px;cursor:pointer">${p.label}</button>`).join('')}
    </div>
  </div>

  <!-- TOGGLES -->
  <div class="orow" style="border-top:1px solid ${gC(P,.1)};padding-top:14px">
    <div><div style="color:${P};font-size:13px;font-weight:700">ॐ Floating Om</div><div style="color:${M};font-size:11px;margin-top:2px">Soft Om symbols in the background</div></div>
    <div class="tgl" style="background:${sShowOm?gC(P,.3):gC(P,.08)};border-color:${sShowOm?gC(P,.6):gC(P,.2)}" onclick="sShowOm=!sShowOm;renderSetup()"><div class="tgk" style="left:${sShowOm?23:3}px;background:${sShowOm?P:'rgba(255,255,255,.2)'}"></div></div>
  </div>
  <div class="orow">
    <div><div style="color:${P};font-size:13px;font-weight:700">🔁 Loop</div><div style="color:${M};font-size:11px;margin-top:2px">Repeat the verse continuously</div></div>
    <div class="tgl" style="background:${sLoop?gC(P,.3):gC(P,.08)};border-color:${sLoop?gC(P,.6):gC(P,.2)}" onclick="sLoop=!sLoop;renderSetup()"><div class="tgk" style="left:${sLoop?23:3}px;background:${sLoop?P:'rgba(255,255,255,.2)'}"></div></div>
  </div>

  <div style="background:${gC(P,.06)};border:1px solid ${gC(P,.18)};border-radius:12px;padding:13px">
    <div style="color:${P};font-size:13px;font-weight:700;margin-bottom:6px">📱 Using platform audio?</div>
    <div style="color:${gC(P,.55)};font-size:12px;line-height:1.7">Play the song on another device → tap <strong style="color:${P}">👆 Tap To Time</strong> → tap on each line change → export → add that sound after uploading. It'll line up.</div>
  </div>

  <button onclick="savePreset()" ${!sLines.length?'disabled':''} style="background:transparent;color:${sLines.length?P:gC(P,.2)};border:1px solid ${sLines.length?gC(P,.4):gC(P,.1)};border-radius:40px;padding:14px;font-size:14px;font-weight:700;cursor:${sLines.length?'pointer':'not-allowed'};font-family:inherit">💾 Save Preset</button>
  <button class="go" onclick="startPlayer()" style="background:${sLines.length?`linear-gradient(135deg,${dC(P)},${P},${dC(P)})`:'rgba(255,255,255,.06)'};color:${sLines.length?'#1a1000':'rgba(255,255,255,.2)'};cursor:${sLines.length?'pointer':'not-allowed'}">${sLines.length?'▶ PREVIEW':'Add your lyrics first'}</button>
  </div>`;
  syncGo();
}
function syncGo(){
  const P=TH().p,has=sLines.length>0;
  const s=el('sticky'),b=el('stickyGo');
  s.style.display='flex';
  b.textContent=has?'▶ PREVIEW':'Add your lyrics first';
  b.style.background=has?`linear-gradient(135deg,${dC(P)},${P},${dC(P)})`:'rgba(120,120,120,.5)';
  b.style.color=has?'#1a1000':'rgba(255,255,255,.5)';
  b.style.cursor=has?'pointer':'not-allowed';
}
renderSetup();

</script>
</body>
</html>
